; ─────────────────────────────────────────────────────────────────────────────
; ARC Recipe Transfer Bot — Configuration
; Edit this file then restart secs_proxy_bot.exe.
; Lines starting with ; are comments.
; ─────────────────────────────────────────────────────────────────────────────

[file_channel]
; RATS initiates this connection. PWB bytes return through the same full-duplex
; TCP session, so this bot never connects to host HTTP port 8080.
file_listen_ip = 0.0.0.0
file_listen_port = 5003
file_channel_token = CHANGE_ME
machine_id = WB#82
; Maximum accepted PWB snapshot size (20 MiB)
max_file_bytes = 20971520
; Accepted snapshots are retained in recipe_outbox until the host confirms them.

[watcher]
; Directory to watch for new .PWB recipe files
; TODO: Set this to the actual recipe export path on the Equipment PC
watch_dir = C:\SYSTEM\BONDPROG
file_ext  = .PWB

[log]
; Log file path (relative to secs_proxy_bot.exe location)
log_file  = recipe_bot.log
; Log level: INFO or DEBUG (DEBUG logs every forwarded packet — verbose)
log_level = INFO
